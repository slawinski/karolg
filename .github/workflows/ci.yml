name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAYLOAD_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      DATABASE_URL: file:./data/ci.db
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p data
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:browser
      - run: pnpm test:browser:webkit
      - run: pnpm typecheck
      - run: pnpm exec payload migrate
      - run: pnpm test:slugs
      - run: pnpm test:social-metadata
